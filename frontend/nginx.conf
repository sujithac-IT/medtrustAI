map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Coarse abuse protection in front of the API (the app has its own per-account limits too).
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

upstream medtrust_api {
    server backend:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/snippets/security_headers.inc;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/security_headers.inc;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security_headers.inc;
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/api/auth/(login|register|demo|firebase)$ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://medtrust_api;
        include /etc/nginx/snippets/proxy_headers.inc;
    }

    # REST + WebSocket (signalling, live transcript) to the API containers
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://medtrust_api;
        include /etc/nginx/snippets/proxy_headers.inc;
        proxy_read_timeout 3600s;
    }
}
