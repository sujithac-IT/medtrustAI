# Default: one small API container + nginx, SQLite on a volume (~100 MB RAM total).
#   docker compose up --build                      -> http://localhost:3000
# Scale-out (PostgreSQL + Redis + N API replicas): see docker-compose.scale.yml
services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 8080
      DATABASE_PATH: /data/medtrust.db
      FRONTEND_DIST: /nonexistent
    volumes: [medtrust-data:/data]
    restart: unless-stopped
    mem_limit: 256m

  frontend:
    build:
      context: ./frontend
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    ports: ["3000:80"]
    depends_on: [backend]
    restart: unless-stopped
    mem_limit: 64m

volumes:
  medtrust-data:
