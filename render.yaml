services:
  - type: web
    name: medtrust-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    plan: free               # no persistent disk: SQLite resets on redeploy. Switch to starter + disk when funded.
    envVars:
      - key: DATABASE_PATH
        value: /tmp/medtrust.db
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: DOCTOR_INVITE_CODE
        value: MEDTRUST-STAFF
      - key: CORS_ORIGINS
        value: "*"             # backend uses bearer tokens (no cookies); tighten to the Vercel URL later
      - key: GEMINI_API_KEY
        sync: false
